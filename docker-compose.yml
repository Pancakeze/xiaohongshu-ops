services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xhs
      POSTGRES_PASSWORD: xhs
      POSTGRES_DB: xiaohongshu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xhs -d xiaohongshu"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    profiles: [app, static]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://xhs:xhs@postgres:5432/xiaohongshu
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-dev-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      UPLOAD_DIR: data/uploads
      GOOGLE_GENERATED_DIR: data/generated/google
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  web:
    profiles: [app]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_API: http://api:8000
      VITE_DEV_HOST: 0.0.0.0
      VITE_API_BEARER_TOKEN: ${API_BEARER_TOKEN:-dev-change-me}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  web-static:
    profiles: [static]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BEARER_TOKEN: ${API_BEARER_TOKEN:-dev-change-me}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
