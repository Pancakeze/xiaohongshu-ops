services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xhs
      POSTGRES_PASSWORD: xhs
      POSTGRES_DB: xiaohongshu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xhs -d xiaohongshu"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
